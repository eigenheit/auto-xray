name: Apply install timing monitor packaging

on:
  push:
    branches: [fix/runtime-performance-2.5.15]
    paths:
      - '.github/workflows/apply-install-monitor-packaging.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-performance-2.5.15
          fetch-depth: 0

      - name: Patch CI and packaging workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old!r}')
              text = text.replace(old, new, count)
              p.write_text(text)

          # CI validates both reusable user-facing test entry points and guards
          # that release packaging keeps them together.
          replace(
              '.github/workflows/ci.yml',
              'for f in scripts/*.command scripts/*.sh RUN_AUTO_XRAY_TESTS.command; do',
              'for f in scripts/*.command scripts/*.sh RUN_AUTO_XRAY_TESTS.command RUN_AUTO_XRAY_INSTALL_TEST.command; do'
          )
          replace(
              '.github/workflows/ci.yml',
              "          grep -Fq 'RUN_AUTO_XRAY_TESTS.command' .github/workflows/package-installer.yml\n",
              "          grep -Fq 'RUN_AUTO_XRAY_TESTS.command' .github/workflows/package-installer.yml\n          grep -Fq 'RUN_AUTO_XRAY_INSTALL_TEST.command' .github/workflows/package-installer.yml\n          grep -Fq 'Process.clock_gettime(Process::CLOCK_MONOTONIC)' RUN_AUTO_XRAY_INSTALL_TEST.command\n          grep -Fq 'FIRST_LAUNCH' RUN_AUTO_XRAY_INSTALL_TEST.command\n          grep -Fq 'RUNTIME_TEST_START' RUN_AUTO_XRAY_INSTALL_TEST.command\n"
          )
          replace(
              '.github/workflows/ci.yml',
              "          grep -Fq 'Diagnostics/RUN_AUTO_XRAY_TESTS.command' .github/workflows/release-draft.yml\n",
              "          grep -Fq 'Diagnostics/RUN_AUTO_XRAY_TESTS.command' .github/workflows/release-draft.yml\n          grep -Fq 'Diagnostics/RUN_AUTO_XRAY_INSTALL_TEST.command' .github/workflows/release-draft.yml\n"
          )

          # Standalone ZIP artifact: ship the pre-install observer beside the
          # runtime self-test and preserve execute permission.
          replace(
              '.github/workflows/package-installer.yml',
              "      - 'RUN_AUTO_XRAY_TESTS.command'\n",
              "      - 'RUN_AUTO_XRAY_TESTS.command'\n      - 'RUN_AUTO_XRAY_INSTALL_TEST.command'\n"
          )
          replace(
              '.github/workflows/package-installer.yml',
              '          cp RUN_AUTO_XRAY_TESTS.command "$PKG/RUN_AUTO_XRAY_TESTS.command"\n',
              '          cp RUN_AUTO_XRAY_TESTS.command "$PKG/RUN_AUTO_XRAY_TESTS.command"\n          cp RUN_AUTO_XRAY_INSTALL_TEST.command "$PKG/RUN_AUTO_XRAY_INSTALL_TEST.command"\n'
          )
          replace(
              '.github/workflows/package-installer.yml',
              '                   "$PKG/RUN_AUTO_XRAY_TESTS.command" \\\n',
              '                   "$PKG/RUN_AUTO_XRAY_TESTS.command" \\\n                   "$PKG/RUN_AUTO_XRAY_INSTALL_TEST.command" \\\n'
          )
          replace(
              '.github/workflows/package-installer.yml',
              '                  "VERSION", "RUN_AUTO_XRAY_TESTS.command",\n',
              '                  "VERSION", "RUN_AUTO_XRAY_TESTS.command", "RUN_AUTO_XRAY_INSTALL_TEST.command",\n'
          )
          replace(
              '.github/workflows/package-installer.yml',
              '                  "INSTALL_AUTO_XRAY_CATALINA.command", "RUN_AUTO_XRAY_TESTS.command",\n',
              '                  "INSTALL_AUTO_XRAY_CATALINA.command", "RUN_AUTO_XRAY_TESTS.command", "RUN_AUTO_XRAY_INSTALL_TEST.command",\n'
          )
          replace(
              '.github/workflows/package-installer.yml',
              '          bash -n "$PKG/RUN_AUTO_XRAY_TESTS.command"\n',
              '          bash -n "$PKG/RUN_AUTO_XRAY_TESTS.command"\n          bash -n "$PKG/RUN_AUTO_XRAY_INSTALL_TEST.command"\n'
          )
          replace(
              '.github/workflows/package-installer.yml',
              '          1. Запустите INSTALL_AUTO_XRAY_CATALINA.command.\n',
              '          1. Для полного замера сначала запустите RUN_AUTO_XRAY_INSTALL_TEST.command.\n          2. Затем запустите INSTALL_AUTO_XRAY_CATALINA.command; монитор сам дождётся первого запуска.\n'
          )

          # Release ZIP and DMG Diagnostics carry the same pre-install observer.
          replace(
              '.github/workflows/release-draft.yml',
              '          cp RUN_AUTO_XRAY_TESTS.command "$PKG/RUN_AUTO_XRAY_TESTS.command"\n',
              '          cp RUN_AUTO_XRAY_TESTS.command "$PKG/RUN_AUTO_XRAY_TESTS.command"\n          cp RUN_AUTO_XRAY_INSTALL_TEST.command "$PKG/RUN_AUTO_XRAY_INSTALL_TEST.command"\n'
          )
          replace(
              '.github/workflows/release-draft.yml',
              '                   "$PKG/RUN_AUTO_XRAY_TESTS.command" \\\n',
              '                   "$PKG/RUN_AUTO_XRAY_TESTS.command" \\\n                   "$PKG/RUN_AUTO_XRAY_INSTALL_TEST.command" \\\n'
          )
          replace(
              '.github/workflows/release-draft.yml',
              '          test -x "$PAYLOAD/RUN_AUTO_XRAY_TESTS.command"\n',
              '          test -x "$PAYLOAD/RUN_AUTO_XRAY_TESTS.command"\n          test -x "$PAYLOAD/RUN_AUTO_XRAY_INSTALL_TEST.command"\n'
          )
          replace(
              '.github/workflows/release-draft.yml',
              '          cp "$PAYLOAD/RUN_AUTO_XRAY_TESTS.command" "$ROOT/Diagnostics/RUN_AUTO_XRAY_TESTS.command"\n',
              '          cp "$PAYLOAD/RUN_AUTO_XRAY_TESTS.command" "$ROOT/Diagnostics/RUN_AUTO_XRAY_TESTS.command"\n          cp "$PAYLOAD/RUN_AUTO_XRAY_INSTALL_TEST.command" "$ROOT/Diagnostics/RUN_AUTO_XRAY_INSTALL_TEST.command"\n'
          )
          replace(
              '.github/workflows/release-draft.yml',
              '          chmod +x "$ROOT/Diagnostics/TEST_INSTALLER_UI.command" \\\n                   "$ROOT/Diagnostics/RUN_AUTO_XRAY_TESTS.command"\n',
              '          chmod +x "$ROOT/Diagnostics/TEST_INSTALLER_UI.command" \\\n                   "$ROOT/Diagnostics/RUN_AUTO_XRAY_TESTS.command" \\\n                   "$ROOT/Diagnostics/RUN_AUTO_XRAY_INSTALL_TEST.command"\n'
          )
          replace(
              '.github/workflows/release-draft.yml',
              '          ДО УСТАНОВКИ:\n          1. Запустите TEST_INSTALLER_UI.command.\n          2. После появления окна полоса должна заметно пройти несколько этапов до 100%.\n          3. Тест ничего не устанавливает, не запускает installer app и не меняет системный proxy.\n          4. На Desktop будет создан AUTO_Xray_Installer_UI_Test_*.txt.\n\n          ПОСЛЕ УСТАНОВКИ И ОБНОВЛЕНИЯ ПОДПИСКИ:\n          Запустите RUN_AUTO_XRAY_TESTS.command для полной runtime-проверки.\n',
              '          ПОЛНЫЙ ТЕСТ УСТАНОВКИ:\n          1. Сначала запустите RUN_AUTO_XRAY_INSTALL_TEST.command.\n          2. Затем обычным способом запустите Install AUTO Xray.app.\n          3. Монитор зафиксирует процессы установки и первого запуска с таймером.\n          4. После первого запуска он предложит начать RUN_AUTO_XRAY_TESTS.command.\n\n          ОТДЕЛЬНЫЙ UI-PREFLIGHT:\n          TEST_INSTALLER_UI.command только проверяет движение индикатора и ничего не устанавливает.\n'
          )
          PY

          /bin/bash -n RUN_AUTO_XRAY_INSTALL_TEST.command
          /bin/bash -n RUN_AUTO_XRAY_TESTS.command

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-install-monitor-packaging.yml
          git add .github/workflows/ci.yml .github/workflows/package-installer.yml .github/workflows/release-draft.yml
          git commit -m 'Package install timing monitor with diagnostics'
          git push origin HEAD:fix/runtime-performance-2.5.15
