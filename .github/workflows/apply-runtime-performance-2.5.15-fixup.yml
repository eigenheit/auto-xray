name: Apply runtime performance 2.5.15 fixup

on:
  push:
    branches: [fix/runtime-performance-2.5.15]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-performance-2.5.15
      - name: Apply fixup and validate
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .runtime-performance-2.5.15-fixup.patch
          git apply .runtime-performance-2.5.15-fixup.patch
          rm .runtime-performance-2.5.15-fixup.patch
          rm .github/workflows/apply-runtime-performance-2.5.15-fixup.yml
          ruby -c src/auto-xray-helper.rb
          grep -Fq 'Process.wait(pid) rescue nil' src/auto-xray-helper.rb
      - name: Commit fixup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reap failed startup process before recovery"
          git push origin HEAD:fix/runtime-performance-2.5.15
