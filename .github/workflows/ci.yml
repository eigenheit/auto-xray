name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/*.command; do
            echo "Checking $f"
            /bin/bash -n "$f"
          done

      - name: Validate Ruby helpers
        shell: bash
        run: |
          set -euo pipefail
          ruby --version
          ruby -c src/auto-xray-helper.rb
          ruby -c src/auto-xray-supervisor.rb

      - name: Compile AppleScript menu app
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          sed -E "s/2\.5\.[0-9]+/${VERSION}/g" src/AUTO_Xray.applescript > /tmp/AUTO_Xray.applescript
          rm -rf "/tmp/AUTO Xray.app"
          /usr/bin/osacompile -s -o "/tmp/AUTO Xray.app" /tmp/AUTO_Xray.applescript

      - name: Validate Xray metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^Xray 1\.8\.4' vendor/xray/XRAY_VERSION.txt
          grep -Eq '^[0-9a-f]{64}  xray$' vendor/xray/XRAY_SHA256.txt

      - name: Validate version and icon packaging
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          grep -Fq 'sed -E "s/2\.5\.[0-9]+/${VERSION}/g"' scripts/install-catalina.command
          test -s assets/dove-clean.png.b64
          /usr/bin/base64 -D -i assets/dove-clean.png.b64 -o /tmp/dove-clean.png
          file /tmp/dove-clean.png | grep -q 'PNG image data'

      - name: Scan tracked text for private runtime markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE --exclude-dir=.git --exclude='ci.yml' \
            '(subscription_url\.txt.*https?://|/Users/imac/|55cc8ea1-17bf-48e2-ba8b-8864eff63d05|7b7dec75|70c2)' .; then
            echo 'Potential private/runtime data found in tracked files.' >&2
            exit 1
          fi
