name: Promote Stable Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.stable-trigger'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Promote current version to stable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          gh release view "$TAG" >/dev/null

          cat > /tmp/STABLE_RELEASE_NOTES.md <<EOF
          # AUTO Xray ${VERSION} — Catalina Intel

          Standalone VLESS/Reality client for legacy Intel Macs.

          **Проверенная система:** Intel Mac (x86_64), macOS Catalina 10.15.x.

          ## Установка через DMG

          1. Скачайте \`AUTO_Xray_Catalina_v${VERSION}.dmg\`.
          2. Откройте DMG и найдите **Install AUTO Xray.app**.
          3. Выполните **Control + клик → Open / Открыть**.
          4. На Catalina первое предупреждение может не содержать кнопки **Open / Открыть**. Нажмите **Cancel / Отменить**, затем снова выполните **Control + клик → Open / Открыть**.
          5. Во втором предупреждении нажмите **Open / Открыть**.
          6. После установки нажмите 🕊 → **Обновить подписку** → вставьте HTTPS-ссылку → выберите RF/EU/World → **Включить**.

          После установки AUTO Xray стартует в состоянии **OFF**, поэтому обычный интернет работает напрямую до включения прокси.

          Для Telegram выберите **Use system proxy settings**.

          Резервный вариант установки: \`AUTO_Xray_Catalina_Installer_v${VERSION}.zip\`.

          Xray-core 1.8.4 уже находится внутри установочного пакета. На пользовательском Mac он отдельно не скачивается.

          **Статус:** Stable. DMG-установка, Gatekeeper flow, обновление подписки, ON/OFF, системный proxy, восстановление после переподключения Wi-Fi и отзывчивость menu-bar интерфейса проверены на реальном Intel Mac с macOS Catalina.
          EOF

          gh release edit "$TAG" \
            --prerelease=false \
            --draft=false \
            --title "AUTO Xray ${VERSION}" \
            --notes-file /tmp/STABLE_RELEASE_NOTES.md

          echo "Promoted $TAG to stable."
