name: Validate repository v2

on:
  push:
    branches:
      - main
      - 'automation/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Validate source and scripts
        run: bash scripts/validate-v2.sh

      - name: Check version file
        run: |
          test -s VERSION
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION

      - name: Check Xray metadata
        run: |
          test -s vendor/XRAY_VERSION.txt
          test -s vendor/XRAY_SHA256.txt
          grep -q '1.8.4' vendor/XRAY_VERSION.txt
          grep -Eq '^[0-9a-f]{64}' vendor/XRAY_SHA256.txt

      - name: Verify no bundled runtime binary in source tree
        run: |
          if git ls-files | grep -E '(^|/)(xray|Xray)$'; then
            echo 'Runtime Xray binary must not be committed to source.'
            exit 1
          fi
