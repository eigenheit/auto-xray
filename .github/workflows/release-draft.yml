name: Publish Pre-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.release-trigger'

permissions:
  contents: write

jobs:
  release:
    name: Build ZIP and publish pre-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download and verify official Xray-core 1.8.4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release/xray-download
          curl -fL \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            -o .release/Xray-macos-64.zip \
            https://github.com/XTLS/Xray-core/releases/download/v1.8.4/Xray-macos-64.zip
          unzip -q .release/Xray-macos-64.zip -d .release/xray-download
          XRAY="$(find .release/xray-download -type f -name xray -print -quit)"
          test -n "$XRAY"
          EXPECTED="$(awk '{print $1}' vendor/xray/XRAY_SHA256.txt)"
          ACTUAL="$(sha256sum "$XRAY" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p .release/core
          cp "$XRAY" .release/core/xray
          chmod +x .release/core/xray

      - name: Build clean macOS application icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release
          curl -fL \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            -o .release/dove.svg \
            https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f54a.svg
          python3 -m pip install --quiet pillow cairosvg
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image

          svg = Path('.release/dove.svg')
          png = Path('.release/dove-1024.png')
          dst = Path('.release/Dove.icns')
          assert svg.stat().st_size > 100
          cairosvg.svg2png(url=str(svg), write_to=str(png), output_width=1024, output_height=1024)
          im = Image.open(png).convert('RGBA')
          im.load()
          im.save(dst, format='ICNS')
          assert dst.stat().st_size > 10000
          PY

      - name: Assemble standalone Catalina ZIP installer
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          NAME="AUTO_Xray_Catalina_Installer_v${VERSION}"
          PKG="dist/$NAME"

          mkdir -p "$PKG/src" "$PKG/assets" "$PKG/vendor/xray" "$PKG/scripts" "$PKG/docs"
          cp VERSION "$PKG/VERSION"
          cp THIRD_PARTY_NOTICES.txt "$PKG/THIRD_PARTY_NOTICES.txt"
          cp RUN_AUTO_XRAY_TESTS.command "$PKG/RUN_AUTO_XRAY_TESTS.command"
          cp src/AUTO_Xray.applescript "$PKG/src/AUTO_Xray.applescript"
          sed -i -E "s/2\\.5\\.[0-9]+/${VERSION}/g" "$PKG/src/AUTO_Xray.applescript"
          cp src/auto-xray-helper.rb "$PKG/src/auto-xray-helper.rb"
          cp src/auto-xray-supervisor.rb "$PKG/src/auto-xray-supervisor.rb"
          cp .release/Dove.icns "$PKG/assets/Dove.icns"
          cp vendor/xray/XRAY_VERSION.txt "$PKG/vendor/xray/XRAY_VERSION.txt"
          cp vendor/xray/XRAY_SHA256.txt "$PKG/vendor/xray/XRAY_SHA256.txt"
          cp .release/core/xray "$PKG/vendor/xray/xray"
          cp scripts/install-catalina.command "$PKG/scripts/install-catalina.command"
          cp scripts/uninstall.command "$PKG/UNINSTALL_AUTO_XRAY.command"
          cp docs/INSTALLATION.md "$PKG/docs/INSTALLATION.md"
          cp docs/TROUBLESHOOTING.md "$PKG/docs/TROUBLESHOOTING.md"
          cp docs/TELEGRAM.md "$PKG/docs/TELEGRAM.md"

          cat > "$PKG/INSTALL_AUTO_XRAY_CATALINA.command" <<'WRAPPER'
          #!/bin/bash
          set -euo pipefail
          cd "$(dirname "$0")"
          exec /bin/bash scripts/install-catalina.command
          WRAPPER

          cat > "$PKG/README.txt" <<EOF
          AUTO Xray ${VERSION} — Intel Mac / macOS Catalina
          =================================================

          Основной способ установки этой версии — DMG из GitHub Releases.
          Этот ZIP оставлен как резервный вариант.

          1. Запустите INSTALL_AUTO_XRAY_CATALINA.command.
          2. Если macOS блокирует запуск: Control + клик → Open / Открыть.
          3. Нажмите 🕊 → Обновить подписку → вставьте HTTPS-ссылку.
          4. Выберите RF / EU / World → Включить.

          Для диагностики после установки можно запустить
          RUN_AUTO_XRAY_TESTS.command. В ZIP сохранено право на выполнение,
          поэтому отдельный chmod обычно не требуется.

          Telegram: Use system proxy settings.

          Не отключайте Gatekeeper глобально.
          Подробности: docs/INSTALLATION.md
          EOF

          chmod +x "$PKG/INSTALL_AUTO_XRAY_CATALINA.command" \
                   "$PKG/RUN_AUTO_XRAY_TESTS.command" \
                   "$PKG/scripts/install-catalina.command" \
                   "$PKG/UNINSTALL_AUTO_XRAY.command" \
                   "$PKG/vendor/xray/xray"

          (cd dist && zip -qry "${NAME}.zip" "$NAME")
          (cd dist && sha256sum "${NAME}.zip" > SHA256SUMS.txt)

      - name: Create release notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > dist/RELEASE_NOTES.md <<EOF
          # AUTO Xray ${VERSION} — Catalina Intel

          Standalone VLESS/Reality client for legacy Intel Macs.

          **Проверенная система:** Intel Mac (x86_64), macOS Catalina 10.15.x.

          ## Что изменилось

          - сохранено устойчивое AUTO-переключение RF/EU/World через supervisor recovery из 2.5.10;
          - фактическая DMG-установка снова использует быстрый нативный Cocoa-индикатор внутри уже разрешённого пользователем installer app;
          - установщик ждёт подтверждения, что окно индикатора реально появилось, и только после этого начинает установочные операции;
          - индикатор теперь определённый (0–100%) и меняется по реальным этапам установки: проверка, подготовка, создание приложения, копирование компонентов, настройка, bootstrap и запуск;
          - удалён лишний текст «Окно закроется автоматически»;
          - TEST_INSTALLER_UI.command остаётся Gatekeeper-safe: до установки он не запускает Install AUTO Xray.app, а системным Python/PyObjC показывает движущуюся имитацию того же интерфейса;
          - RUN_AUTO_XRAY_TESTS.command остаётся в папке Diagnostics для runtime-проверки после установки;
          - сетевые параметры VLESS/Reality, группы RF/EU/World, proxy-порты и Xray-core не менялись.

          ## Проверка и установка через DMG

          1. Скачайте \`AUTO_Xray_Catalina_v${VERSION}.dmg\` и откройте его.
          2. Сначала откройте папку **Diagnostics** и запустите **TEST_INSTALLER_UI.command**. Тест ничего не устанавливает; после появления окна полоса должна заметно пройти несколько этапов до 100%.
          3. После теста запустите **Install AUTO Xray.app**.
          4. Если Catalina блокирует запуск: используйте **Control + клик → Open / Открыть**. Gatekeeper глобально отключать не нужно.
          5. Во время реальной установки окно индикатора должно появиться до начала установочных операций, а полоса и подпись — изменяться по ходу работы.
          6. После установки нажмите 🕊 → **Обновить подписку** → вставьте HTTPS-ссылку → выберите RF/EU/World → **Включить**.
          7. Для полной runtime-проверки запустите **Diagnostics/RUN_AUTO_XRAY_TESTS.command** и сохраните созданный архив отчёта.

          После установки AUTO Xray стартует в состоянии **OFF**: обычный интернет должен работать напрямую.

          Для Telegram выберите **Use system proxy settings**.

          Xray-core 1.8.4 находится внутри установочного пакета. На пользовательском Mac он отдельно не скачивается.

          **Статус:** pre-release до проверки текущей версии на реальном Intel Mac с Catalina.
          EOF

      - name: Create or update GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          ZIP="dist/AUTO_Xray_Catalina_Installer_v${VERSION}.zip"
          SUM="dist/SHA256SUMS.txt"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SUM" --clobber
            gh release edit "$TAG" --prerelease --draft=false --title "AUTO Xray ${VERSION}" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$TAG" "$ZIP" "$SUM" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "AUTO Xray ${VERSION}" \
              --notes-file dist/RELEASE_NOTES.md
          fi

  dmg:
    name: Build Catalina DMG and attach to release
    needs: release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download the exact ZIP payload already published
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          mkdir -p .release/download .release/unpacked
          gh release download "$TAG" \
            --pattern "AUTO_Xray_Catalina_Installer_v${VERSION}.zip" \
            --dir .release/download
          unzip -q ".release/download/AUTO_Xray_Catalina_Installer_v${VERSION}.zip" -d .release/unpacked

          PAYLOAD=".release/unpacked/AUTO_Xray_Catalina_Installer_v${VERSION}"
          test -f "$PAYLOAD/VERSION"
          test -f "$PAYLOAD/assets/Dove.icns"
          test -x "$PAYLOAD/vendor/xray/xray"
          test -x "$PAYLOAD/RUN_AUTO_XRAY_TESTS.command"

          EXPECTED="$(head -n 1 "$PAYLOAD/vendor/xray/XRAY_SHA256.txt" | cut -c 1-64)"
          ACTUAL="$(shasum -a 256 "$PAYLOAD/vendor/xray/xray" | cut -c 1-64)"
          test "$ACTUAL" = "$EXPECTED"

      - name: Build Catalina-compatible installer app bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PAYLOAD=".release/unpacked/AUTO_Xray_Catalina_Installer_v${VERSION}"
          ROOT=".release/dmg-root"
          APP="$ROOT/Install AUTO Xray.app"
          PROGRESS_BIN=".release/installer-progress"

          rm -rf "$ROOT"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$ROOT/Diagnostics"

          /usr/bin/xcrun clang \
            -arch x86_64 \
            -mmacosx-version-min=10.15 \
            -fobjc-arc \
            -framework Cocoa \
            scripts/dmg-install-progress.m \
            -o "$PROGRESS_BIN"
          chmod +x "$PROGRESS_BIN"
          /usr/bin/file "$PROGRESS_BIN" | grep -Fq 'x86_64'

          cp scripts/dmg-installer-launcher.sh "$APP/Contents/MacOS/installer"
          chmod +x "$APP/Contents/MacOS/installer"
          cp "$PROGRESS_BIN" "$APP/Contents/Resources/installer-progress"
          chmod +x "$APP/Contents/Resources/installer-progress"
          cp "$PAYLOAD/assets/Dove.icns" "$APP/Contents/Resources/Dove.icns"
          /usr/bin/ditto "$PAYLOAD" "$APP/Contents/Resources/payload"

          cp scripts/TEST_INSTALLER_UI.command "$ROOT/Diagnostics/TEST_INSTALLER_UI.command"
          cp "$PAYLOAD/RUN_AUTO_XRAY_TESTS.command" "$ROOT/Diagnostics/RUN_AUTO_XRAY_TESTS.command"
          chmod +x "$ROOT/Diagnostics/TEST_INSTALLER_UI.command" \
                   "$ROOT/Diagnostics/RUN_AUTO_XRAY_TESTS.command"
          cat > "$ROOT/Diagnostics/README.txt" <<EOF
          Диагностика AUTO Xray ${VERSION}
          ================================

          ДО УСТАНОВКИ:
          1. Запустите TEST_INSTALLER_UI.command.
          2. После появления окна полоса должна заметно пройти несколько этапов до 100%.
          3. Тест ничего не устанавливает, не запускает installer app и не меняет системный proxy.
          4. На Desktop будет создан AUTO_Xray_Installer_UI_Test_*.txt.

          ПОСЛЕ УСТАНОВКИ И ОБНОВЛЕНИЯ ПОДПИСКИ:
          Запустите RUN_AUTO_XRAY_TESTS.command для полной runtime-проверки.

          Оба command-файла уже имеют право на выполнение. Если Catalina
          блокирует первый запуск, используйте Control + клик → Open / Открыть.
          Gatekeeper глобально отключать не нужно.
          EOF

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key><string>Install AUTO Xray</string>
            <key>CFBundleExecutable</key><string>installer</string>
            <key>CFBundleIconFile</key><string>Dove.icns</string>
            <key>CFBundleIdentifier</key><string>local.autoxray.installer</string>
            <key>CFBundleName</key><string>Install AUTO Xray</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION//./}</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          /usr/bin/plutil -lint "$APP/Contents/Info.plist"
          /bin/bash -n "$APP/Contents/MacOS/installer"
          /bin/bash -n "$ROOT/Diagnostics/TEST_INSTALLER_UI.command"
          /usr/bin/codesign --force --deep --sign - "$APP"
          /usr/bin/codesign --verify --deep --strict "$APP"

          EXPECTED="$(head -n 1 "$PAYLOAD/vendor/xray/XRAY_SHA256.txt" | cut -c 1-64)"
          ACTUAL="$(shasum -a 256 "$APP/Contents/Resources/payload/vendor/xray/xray" | cut -c 1-64)"
          test "$ACTUAL" = "$EXPECTED"
          test -x "$APP/Contents/Resources/installer-progress"
          test -x "$ROOT/Diagnostics/TEST_INSTALLER_UI.command"

          cat > "$ROOT/README.txt" <<EOF
          AUTO Xray ${VERSION} — macOS Catalina / Intel
          ==============================================

          ПЕРЕД УСТАНОВКОЙ рекомендуется открыть папку Diagnostics и запустить
          TEST_INSTALLER_UI.command. После появления окна полоса должна пройти
          несколько этапов до 100%; тест ничего не устанавливает.

          После успешного UI-теста:
          1. Откройте Install AUTO Xray.app.
          2. Если Catalina блокирует запуск: Control + клик → Open / Открыть.
          3. Окно индикатора должно появиться до начала установочных операций,
             а полоса и подпись — изменяться по ходу установки.
          4. После установки голубь появится в строке меню и в Launchpad.

          AUTO Xray запускается в состоянии OFF, поэтому обычный интернет
          должен продолжить работать напрямую до нажатия «Включить».

          После установки и обновления подписки для полной проверки используйте
          Diagnostics/RUN_AUTO_XRAY_TESTS.command.

          Этот релиз не подписан Apple Developer ID и не notarized.
          Не отключайте Gatekeeper глобально.
          EOF

      - name: Create and verify DMG
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          DMG="dist/AUTO_Xray_Catalina_v${VERSION}.dmg"

          hdiutil create \
            -volname "AUTO Xray ${VERSION}" \
            -srcfolder .release/dmg-root \
            -fs HFS+ \
            -format UDZO \
            -ov "$DMG"

          hdiutil verify "$DMG"
          test -s "$DMG"

      - name: Publish DMG and combined checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          ZIP=".release/download/AUTO_Xray_Catalina_Installer_v${VERSION}.zip"
          DMG="dist/AUTO_Xray_Catalina_v${VERSION}.dmg"

          (cd "$(dirname "$ZIP")" && shasum -a 256 "$(basename "$ZIP")") > dist/SHA256SUMS.txt
          (cd dist && shasum -a 256 "$(basename "$DMG")") >> dist/SHA256SUMS.txt

          gh release upload "$TAG" "$DMG" dist/SHA256SUMS.txt --clobber
